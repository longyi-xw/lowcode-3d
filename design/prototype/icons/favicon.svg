    <ellipse cx="512" cy="800" rx="340" ry="70" fill="url(#floorGlow)"></ellipse>
    <polygon points="754,372 512,512 512,792 754,652" fill="url(#rightFace)"></polygon>
    <polygon points="270,372 512,512 512,792 270,652" fill="url(#leftFace)"></polygon>
    <polygon points="512,232 754,372 512,512 270,372" fill="url(#topFace)"></polygon>
    <g stroke-linecap="round" fill="none">
      <line x1="512" y1="232" x2="754" y2="372" stroke="#eaf0ff" stroke-width="6" stroke-opacity="0.85"></line>
      <line x1="512" y1="232" x2="270" y2="372" stroke="#eaf0ff" stroke-width="6" stroke-opacity="0.65"></line>
