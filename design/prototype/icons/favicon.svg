<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2638"></stop>
      <stop offset="1" stop-color="#04060f"></stop>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c1ff" stop-opacity="0.95"></stop>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="topFace" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c7d8ff"></stop>
      <stop offset="1" stop-color="#5b8def"></stop>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a72d4"></stop>
      <stop offset="1" stop-color="#28489a"></stop>
