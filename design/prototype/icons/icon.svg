      <circle cx="345" cy="195" r="1" opacity="0.40"></circle>
      <circle cx="420" cy="280" r="1.5" opacity="0.50"></circle>
      <circle cx="635" cy="220" r="1" opacity="0.45"></circle>
      <circle cx="720" cy="265" r="1.5" opacity="0.55"></circle>
      <circle cx="790" cy="190" r="1" opacity="0.40"></circle>
      <circle cx="180" cy="320" r="1" opacity="0.35"></circle>
      <circle cx="850" cy="320" r="1" opacity="0.40"></circle>
