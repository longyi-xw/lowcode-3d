<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2638"></stop>
      <stop offset="0.4" stop-color="#0e1422"></stop>
      <stop offset="1" stop-color="#040713"></stop>
    </linearGradient>

    
    <radialGradient id="skyGlow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#4a7ed4" stop-opacity="0.40"></stop>
      <stop offset="0.5" stop-color="#1f3a78" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#1f3a78" stop-opacity="0"></stop>
    </radialGradient>

    
    <linearGradient id="horizonBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0"></stop>
      <stop offset="0.5" stop-color="#7ea3ff" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"></stop>
    </linearGradient>

    
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c1ff" stop-opacity="0.95"></stop>
      <stop offset="0.45" stop-color="#5b8def" stop-opacity="0.45"></stop>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"></stop>
    </radialGradient>

    
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c1ff" stop-opacity="0"></stop>
      <stop offset="0.7" stop-color="#7ea3ff" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#dde7ff" stop-opacity="0.32"></stop>
    </linearGradient>

    <linearGradient id="topFace" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c7d8ff"></stop>
      <stop offset="1" stop-color="#5b8def"></stop>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a72d4"></stop>
      <stop offset="1" stop-color="#28489a"></stop>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5cc0"></stop>
      <stop offset="1" stop-color="#193380"></stop>
    </linearGradient>

    <clipPath id="sq">
      <rect x="100" y="100" width="824" height="824" rx="184" ry="184"></rect>
    </clipPath>
  </defs>

  <g clip-path="url(#sq)">
