      <line x1="70" y1="510" x2="954" y2="510" stroke-opacity="0.14" stroke-width="2"></line>
      <line x1="20" y1="555" x2="1004" y2="555" stroke-opacity="0.20" stroke-width="2"></line>
      <line x1="-80" y1="615" x2="1104" y2="615" stroke-opacity="0.26" stroke-width="2.5"></line>
      <line x1="-220" y1="690" x2="1244" y2="690" stroke-opacity="0.32" stroke-width="2.8"></line>
      <line x1="-380" y1="785" x2="1404" y2="785" stroke-opacity="0.38" stroke-width="3.2"></line>
      <line x1="-580" y1="900" x2="1604" y2="900" stroke-opacity="0.44" stroke-width="3.6"></line>
    </g>

    
    <g fill="none" stroke="#5b8def">
      <line x1="-100" y1="924" x2="512" y2="465" stroke-opacity="0.36" stroke-width="2"></line>
      <line x1="150" y1="924" x2="512" y2="465" stroke-opacity="0.30" stroke-width="2"></line>
      <line x1="335" y1="924" x2="512" y2="465" stroke-opacity="0.25" stroke-width="2"></line>
      <line x1="512" y1="924" x2="512" y2="465" stroke-opacity="0.50" stroke="#7ea3ff" stroke-width="2.5"></line>
      <line x1="689" y1="924" x2="512" y2="465" stroke-opacity="0.25" stroke-width="2"></line>
      <line x1="874" y1="924" x2="512" y2="465" stroke-opacity="0.30" stroke-width="2"></line>
      <line x1="1124" y1="924" x2="512" y2="465" stroke-opacity="0.36" stroke-width="2"></line>
    </g>

    
    <rect x="180" y="462" width="664" height="8" fill="url(#horizonBand)"></rect>
    <circle cx="512" cy="465" r="80" fill="#a8c1ff" opacity="0.25"></circle>

    
    <rect x="490" y="180" width="44" height="540" fill="url(#beam)" opacity="0.6"></rect>

    
    <ellipse cx="512" cy="730" rx="290" ry="60" fill="url(#floorGlow)"></ellipse>

    

    
    <ellipse cx="512" cy="710" rx="190" ry="22" fill="#04060f" opacity="0.65"></ellipse>

    
    <polygon points="698,373 512,480 512,695 698,587" fill="url(#rightFace)"></polygon>
    
    <polygon points="326,373 512,480 512,695 326,587" fill="url(#leftFace)"></polygon>
    
    <polygon points="512,265 698,373 512,480 326,373" fill="url(#topFace)"></polygon>

    
    <g stroke-linecap="round" fill="none">
      <line x1="512" y1="265" x2="698" y2="373" stroke="#eaf0ff" stroke-width="3.5" stroke-opacity="0.85"></line>
      <line x1="512" y1="265" x2="326" y2="373" stroke="#eaf0ff" stroke-width="3.5" stroke-opacity="0.65"></line>
      <line x1="512" y1="265" x2="512" y2="480" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"></line>
      <line x1="698" y1="373" x2="698" y2="587" stroke="#a8c1ff" stroke-width="1.5" stroke-opacity="0.40"></line>
      <line x1="326" y1="373" x2="326" y2="587" stroke="#3a5cc0" stroke-width="1.5" stroke-opacity="0.55"></line>
