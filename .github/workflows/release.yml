# Release pipeline — builds the Tauri desktop app on macOS (universal),
# Ubuntu (deb + AppImage), and Windows (msi + exe), then drafts a GitHub
# Release with the artifacts attached.
#
# Triggers:
#   - Pushing a production semver tag like v0.1.0 / v1.2.3
#     (scaffold / pre-release tags such as v0.0.1-scaffold are skipped)
#   - Manual `workflow_dispatch` from the Actions tab
#
# Pre-requisites before the first real release:
#   1. Run `pnpm tauri icon path/to/logo-1024.png` to generate per-platform
#      icons into src-tauri/icons/
#   2. Flip `bundle.active` to true in src-tauri/tauri.conf.json
#   3. (Optional) Add code-signing secrets:
#        APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#        APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID  (notarization)
#        WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#      Unsigned builds work for testing but users see scary warnings on
#      first launch.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Build · ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & draft release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: lowcode-3d ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
